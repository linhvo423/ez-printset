name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build EZ-PrintSet.exe
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        shell: powershell
        run: |
          pyinstaller --clean --noconfirm EZ-PrintSet.spec

      - name: Package release zip
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist\EZ-PrintSet.exe", "README.md" -DestinationPath "release\EZ-PrintSet-windows.zip" -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZ-PrintSet-exe
          path: dist/EZ-PrintSet.exe
          if-no-files-found: error

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZ-PrintSet-windows
          path: release/EZ-PrintSet-windows.zip
          if-no-files-found: error
