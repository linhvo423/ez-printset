name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build EZ-PrintSet.exe
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        shell: powershell
        run: |
          pyinstaller --clean --noconfirm EZ-PrintSet.spec

      - name: Prepare artifact folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release\EZ-PrintSet-windows | Out-Null
          Copy-Item "dist\EZ-PrintSet.exe" "release\EZ-PrintSet-windows\EZ-PrintSet.exe" -Force
          Copy-Item "README.md" "release\EZ-PrintSet-windows\README.md" -Force

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZ-PrintSet-windows
          path: release
          if-no-files-found: error
